<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>과수원ON</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="student-app">
      <section class="login-panel" id="loginPanel">
        <div class="brand">
          <img src="./assets/logo.png" alt="과수원과학 로고" />
          <div>
            <span>과수원과학</span>
            <strong>과수원ON</strong>
          </div>
        </div>
        <div class="notice">
          <strong>과수원ON 시작하기</strong>
          <span>선생님이 안내한 학생 아이디와 비밀번호를 입력해 주세요.</span>
        </div>
        <label>
          학생 아이디
          <input id="studentNameInput" autocomplete="username" placeholder="학생 아이디 입력" />
        </label>
        <label>
          비밀번호
          <input id="studentCodeInput" type="password" autocomplete="current-password" placeholder="비밀번호 입력" />
        </label>
        <button id="loginBtn" type="button">입장하기</button>
        <p class="login-message" id="loginMessage" role="status" aria-live="polite"></p>
        <p class="privacy-note">아이디와 비밀번호는 다른 사람에게 알려주지 마세요. 공용 기기에서는 사용 후 꼭 로그아웃해 주세요.</p>
      </section>

      <section class="room-shell" id="roomShell" hidden>
        <header class="room-header">
          <div>
            <span>과수원ON</span>
            <strong id="studentNameLabel"></strong>
          </div>
          <div class="room-actions">
            <button id="passwordChangeBtn" type="button">비밀번호 변경</button>
            <button id="logoutBtn" type="button">로그아웃</button>
          </div>
        </header>
        <form class="password-panel" id="passwordChangeForm" hidden>
          <strong>비밀번호 변경</strong>
          <label>현재 비밀번호<input id="currentPasswordInput" type="password" autocomplete="current-password" required /></label>
          <label>새 비밀번호<input id="newPasswordInput" type="password" minlength="10" autocomplete="new-password" required /></label>
          <label>새 비밀번호 확인<input id="newPasswordConfirmInput" type="password" minlength="10" autocomplete="new-password" required /></label>
          <div class="password-actions">
            <button type="submit">변경 저장</button>
            <button id="passwordChangeCancelBtn" class="secondary-button" type="button">취소</button>
          </div>
          <p class="login-message" id="passwordChangeMessage" role="status" aria-live="polite"></p>
        </form>
        <section class="announcement-panel">
          <div class="section-title">
            <div>
              <strong>공지사항</strong>
              <p>학원 전체 안내와 내가 수강하는 반의 공지입니다.</p>
            </div>
            <span id="announcementCountLabel">0개</span>
          </div>
          <div id="studentAnnouncementList"></div>
        </section>
        <section class="score-panel">
          <div class="section-title">
            <div>
              <strong>내 성적</strong>
              <p>학교 시험과 학원내 시험에서 입력된 내 점수만 확인할 수 있습니다.</p>
            </div>
            <span id="scoreCountLabel">0개</span>
          </div>
          <div id="studentScoreList"></div>
        </section>
        <div class="room-layout">
          <aside class="room-list">
            <div class="section-title">
              <strong>내 과수원ON</strong>
              <span id="roomCountLabel">0개</span>
            </div>
            <div id="roomList"></div>
          </aside>
          <section class="post-panel">
            <div class="section-title">
              <strong id="roomTitle">게시글</strong>
              <span>최신순</span>
            </div>
            <div id="postList"></div>
          </section>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./app.js"></script>
  </body>
</html>
